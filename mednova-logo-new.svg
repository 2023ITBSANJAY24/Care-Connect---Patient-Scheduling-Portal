<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 550 120" width="550" height="120">
  <defs>
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10B981"/>
      <stop offset="100%" style="stop-color:#059669"/>
    </linearGradient>
    <linearGradient id="handGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6"/>
      <stop offset="100%" style="stop-color:#2563EB"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0A2A43" flood-opacity="0.1"/>
    </filter>
    <filter id="iconShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.1"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="550" height="120" fill="#FFFFFF"/>
  
  <!-- Icon -->
  <g transform="translate(20, 20)" filter="url(#softShadow)">
    <!-- Medical Cross -->
    <g filter="url(#iconShadow)">
      <rect x="28" y="10" width="24" height="60" rx="5" fill="#FFFFFF"/>
      <rect x="10" y="28" width="60" height="24" rx="5" fill="#FFFFFF"/>
    </g>
    
    <!-- Caring Hand -->
    <path d="M 60,75 C 50,85 30,85 20,75 C 10,65 10,45 20,35 C 30,25 45,25 55,35" fill="none" stroke-width="8" stroke="url(#handGradient)" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="40" cy="55" r="12" fill="url(#iconGradient)"/>
  </g>
  
  <!-- Text -->
  <g transform="translate(115, 0)">
    <text x="0" y="55" font-family="Montserrat, Arial, sans-serif" font-size="28" font-weight="700" fill="#0A2A43" letter-spacing="0.5">MedNova Multispeciality Hospital</text>
    <text x="0" y="85" font-family="Poppins, Arial, sans-serif" font-size="16" font-weight="500" fill="#3B82F6" letter-spacing="0.3">CareConnect – Patient Scheduling Portal</text>
  </g>
</svg>
